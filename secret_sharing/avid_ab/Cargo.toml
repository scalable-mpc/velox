[package]
name = "avid_ab"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fields = { package = "fields", path="../../fields"}

consensus = {package = "consensus", git="https://github.com/scalable-mpc/secure-distributed-computing-protocols.git"}
config = { package = "config", git="https://github.com/scalable-mpc/secure-distributed-computing-protocols.git"}
types = { package = "types", git="https://github.com/scalable-mpc/secure-distributed-computing-protocols.git"}
crypto = { package = "crypto", git="https://github.com/scalable-mpc/secure-distributed-computing-protocols.git"}

tokio = { version = "1.0", features = ["full"] }
futures = "^0.3"
bincode = "1"
bytes = "1.0"
tokio-util = "0.6"
tokio-stream = "0.1"
serde = "1.0.70"
log="*"
priority-queue="1"
fnv = "1"
async-recursion = "1.0.0"
anyhow = "1"
sha2 = "0.10.8"

# Erasure coding: commonware's SIMD Reed-Solomon (Leopard-RS over GF(2^16))
# with Merkle commitments and per-shard inclusion proofs. See src/rs.rs.
commonware-coding = "2026.7.0"
commonware-cryptography = "2026.7.0"
commonware-parallel = "2026.7.0"
commonware-codec = "2026.7.0"

# The dealer codes one message per recipient; those n encodings run in parallel.
rayon = "1.10"

network = { package = "network", git = "https://github.com/akhilsb/libnet-rs.git" }
async-trait = "0"
futures-util = "0"

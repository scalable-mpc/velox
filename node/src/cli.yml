name: replica
version: "1.0"
author: hermitsage <dth.bht@gmail.com>
about: MPC node
args:
    - config:
        short: c
        long: config
        help: the config file containing startup information
        takes_value: true
        required: true
    - debug:
        short: v
        multiple: true
        help: sets the verbosity level
    - ip:
        short: i
        long: ip
        help: A file containing all the ips for the other servers
        takes_value: true
    - protocol:
        short: p
        long: protocol
        help: Protocol to run
        takes_value: true
    - syncer:
        short: y
        long: syncer
        help: IPs for the syncer to connect to
        takes_value: true
    - messages:
        short: t
        long: messages
        help: Number of messages to broadcast anonymously
        takes_value: true
    - comp:
        short: o
        long: comp
        help: Compression factor for multiplication gate verification
        takes_value: true
    - rand_batches:
        short: r
        long: rand-batches
        help: Number of sub-batches each random-sharing group is split into (paces ACSS/Sh2t dealing to bound peak memory)
        takes_value: true
    # - bfile:
    #     short: b
    #     long: bfile
    #     help: The location of a file containing the list of all messages to be reliably broadcasted
    #     takes_value: true
    - byz:
        short: b
        long: byzantine
        help: Byzantine faulty or normal node
        takes_value: true
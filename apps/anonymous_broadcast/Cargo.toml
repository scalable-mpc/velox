[package]
name = "anonymous_broadcast"
version = "0.1.0"
edition = "2021"

# Anonymous broadcast over a butterfly mixing network, as an application on the
# Velox engine. Owns its binary; `velox` is the single dependency that carries
# the `Application` trait, the field abstraction and the node runner.

[dependencies]
velox = { package = "velox", path = "../../velox" }

anyhow = "1"
async-trait = "0"
log = "*"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

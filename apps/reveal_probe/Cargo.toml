[package]
name = "reveal_probe"
version = "0.1.0"
edition = "2021"

# An end-to-end check of the engine's public reveal: every party reveals its
# own inputs blinded by random sharings, has the blinds reconstructed as the
# circuit's output, and verifies that revealed − blind is what it dealt. A
# development application; it exists because no other application reveals.

[dependencies]
velox = { package = "velox", path = "../../velox" }

anyhow = "1"
async-trait = "0"
log = "*"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

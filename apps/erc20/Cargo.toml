[package]
name = "erc20"
version = "0.1.0"
edition = "2021"

# Private ERC20 payments on the Planner: account balances and transfer
# amounts are secret-shared, senders and receivers are public, and every
# transfer is checked for funds and sign with secure comparisons. See
# src/lib.rs.

[dependencies]
velox = { package = "velox", path = "../../velox" }

anyhow = "1"
async-trait = "0"
log = "*"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

[package]
name = "bristol_circuit"
version = "0.1.0"
edition = "2021"

# Evaluates a Bristol-style `.arith` arithmetic circuit on the Velox engine. The
# format itself is the `circuit` crate; this is the mapping from a parsed circuit
# onto the `Application` hooks, plus the binary that runs it.

[dependencies]
velox = { package = "velox", path = "../../velox" }
circuit = { package = "circuit", path = "../../circuit" }

anyhow = "1"
async-trait = "0"
log = "*"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

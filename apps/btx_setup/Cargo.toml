[package]
name = "btx_setup"
version = "0.1.0"
edition = "2021"

# Setup generation for batched threshold encryption (BTX, eprint 2026/754;
# simple BTE, eprint 2026/760) as an application on the Velox engine: Shamir
# shares of tau, tau^2, ..., tau^{2B} for a tau no party knows. Owns its
# binary; `velox` is the single dependency that carries the `Application`
# trait, the field abstraction and the node runner.

[dependencies]
velox = { package = "velox", path = "../../velox" }

anyhow = "1"
async-trait = "0"
log = "*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }
